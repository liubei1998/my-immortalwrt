name: Build AnySafe E1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-venv rsync unzip zlib1g-dev file wget curl \
            libelf-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_anysafe_e1=y
          EOF
          make defconfig

      - name: Download packages
        run: make download -j8

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: anysafee1-firmware
          path: |
            bin/targets/qualcommax/ipq60xx/*anysafe_e1*
            bin/targets/qualcommax/ipq60xx/sha256sums
